[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viewport18-gate"
version = "0.1.0"
description = "Deterministic 18-width responsive layout, DOM containment, and zero-egress verification CLI powered by Playwright."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Shady Ismail" },
]
keywords = [
  "responsive-design",
  "playwright",
  "layout-testing",
  "viewport",
  "visual-gate",
  "dom-containment",
  "ci",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "playwright>=1.40,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
viewport18-gate = "viewport18_gate.cli:main"

[project.urls]
Homepage = "https://github.com/shady-ismail/viewport18-gate"
Source = "https://github.com/shady-ismail/viewport18-gate"
Issues = "https://github.com/shady-ismail/viewport18-gate/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "playwright: live headless Chromium integration tests",
]
